name: Publier le site Clipia
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Construire l'APK Android"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparer l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deployer
        id: deployment
        uses: actions/deploy-pages@v4
