name: 🐞 Signaler un problème
description: Quelque chose ne marche pas comme prévu.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: quoi
    attributes: { label: Ce qui se passe, description: "Et ce que tu attendais. Pas de mot de passe ni de clé API." }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version de Clipia, placeholder: "ex. 8.0.0" }
  - type: dropdown
    id: os
    attributes: { label: Système, options: [Windows, macOS, Linux, Android, Autre] }
