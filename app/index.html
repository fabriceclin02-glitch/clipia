<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Clipia X8</title>
<meta name="description" content="Clipia X8 sur téléphone : parle-lui, elle code, crée images, musiques et vidéos, et dirige des agents.">
<meta name="theme-color" content="#080a1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/favicon-32.png">
<link rel="apple-touch-icon" href="icones/clipia-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clipia">
<style>
:root{--bg:#080a1c;--bg2:#0d1030;--carte:#11153a;--carte2:#1a1f4d;--texte:#eef0ff;--doux:#a9afd6;--bord:#2a3070;--violet:#7c5cff;--bleu:#2f8cff;--cyan:#42d7ff;--ok:#43e6a8;--alerte:#ff7a8a;--grad:linear-gradient(135deg,#7c5cff,#2f8cff);--haut:env(safe-area-inset-top);--bas:env(safe-area-inset-bottom);--tab:60px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--texte);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#scene{position:fixed;inset:0;z-index:0;width:100%;height:100%;touch-action:none;display:block}
.vue{position:fixed;inset:0 0 calc(var(--tab) + var(--bas)) 0;z-index:2;display:none;flex-direction:column;pointer-events:none}
.vue.on{display:flex}
.vue>*{pointer-events:auto}
.plein{background:var(--bg);pointer-events:auto;overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--haut) + 14px) 16px 24px;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
header.h{display:flex;align-items:center;gap:10px;padding:calc(var(--haut) + 10px) 14px 6px;pointer-events:none}
header.h>*{pointer-events:auto}
.logo{font-weight:800;letter-spacing:.6px;font-size:18px}.logo small{color:#c9a0ff;font-size:12px;margin-left:4px}
.etat{font-size:12px;color:var(--doux);display:flex;align-items:center;gap:6px}
.point{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 9px var(--ok)}.point.off{background:var(--alerte);box-shadow:0 0 9px var(--alerte)}.point.att{background:var(--cyan);box-shadow:0 0 9px var(--cyan);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.35}}
.moteur{margin-left:auto;padding:6px 12px;border-radius:99px;border:1px solid var(--bord);background:#10143a99;font-size:12px;color:var(--doux);cursor:pointer;max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.espace{flex:1 1 auto;min-height:0}
.sous{flex:0 1 38%;overflow-y:auto;padding:0 18px 8px;text-align:center;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
.sous .moi{font-size:15px;color:#b7bdf0;margin-bottom:8px}
.sous .elle{font-size:19px;line-height:1.45;color:#fff;text-shadow:0 2px 18px #000b;white-space:pre-wrap}
.sous .sys{font-size:13.5px;color:var(--doux);border:1px dashed var(--bord);border-radius:14px;padding:10px 12px;display:inline-block;text-align:left}
.sous .etape{font-size:13px;color:var(--cyan);margin:6px 0}
.idees{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 14px 8px}
.idee{padding:9px 14px;border-radius:99px;border:1px solid var(--bord);background:#161b4acc;font-size:13.5px;cursor:pointer}
.bas{padding:6px 14px 12px}
.saisie{display:none;align-items:flex-end;gap:8px;margin-bottom:10px}.saisie.on{display:flex}
textarea,input[type=text],input[type=password],input[type=url],input[type=number],select{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--bord);background:var(--carte);color:var(--texte);font:inherit;font-size:16px;outline:none;user-select:text;-webkit-user-select:text}
textarea{resize:none;max-height:120px;min-height:46px;flex:1}
input,select,textarea{margin-bottom:0}
.champ{margin-bottom:12px}
label{display:block;font-size:13px;color:var(--doux);margin:0 0 6px}
.rond{width:46px;height:46px;border-radius:50%;border:1px solid var(--bord);background:var(--carte2);color:#fff;font-size:19px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.rond.p{background:var(--grad);border-color:transparent}
.cmd{display:flex;align-items:center;justify-content:center;gap:18px}
.micro{width:74px;height:74px;border-radius:50%;border:none;color:#fff;font-size:30px;display:grid;place-items:center;cursor:pointer;background:var(--grad);box-shadow:0 10px 34px #5a4dff77}
.micro.on{background:linear-gradient(135deg,#ff6ba8,#ff9a5c);animation:respire 1.2s ease-in-out infinite;box-shadow:0 10px 40px #ff6ba877}
@keyframes respire{50%{transform:scale(1.08)}}
.mode{text-align:center;font-size:12px;color:var(--doux);margin-top:6px}
/* accueil, studio, store */
.acc{pointer-events:none}.acc .haut{flex:0 0 30dvh;display:flex;align-items:flex-end;justify-content:center;padding:calc(var(--haut) + 8px) 16px 6px;pointer-events:none;text-align:center}
.acc .haut b{font-size:13px;color:var(--doux);background:#0b0e2acc;border:1px solid var(--bord);padding:5px 12px;border-radius:99px;pointer-events:auto}
.acc .panneau{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#0b0e2aee,#080a1cf7);border-top:1px solid var(--bord);border-radius:26px 26px 0 0;padding:16px 14px 20px;pointer-events:auto;-webkit-overflow-scrolling:touch}
.gi{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0}
.ic .pic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,#232a6e,#12163f);border:1px solid #3a42a0;box-shadow:0 8px 18px #0008,inset 0 1px 0 #ffffff22;overflow:hidden}
.ic .pic img{width:100%;height:100%;object-fit:cover}.ic:active .pic{transform:scale(.92) perspective(200px) rotateX(10deg)}
.ic span{font-size:11.5px;color:var(--texte);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic.bientot .pic{opacity:.55}
.titre-s{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--doux);margin:18px 4px 10px}
.st{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--bord);background:var(--carte);margin-bottom:10px}
.st .e{font-size:30px;width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:#1a1f4d;flex:0 0 auto}
.st .t{flex:1;min-width:0}.st .t b{display:block;font-size:15px}.st .t span{font-size:12.5px;color:var(--doux);display:block}.st .t i{font-style:normal;font-size:11px;color:#8a91bd}
.st button{flex:0 0 auto}
/* barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:12;height:calc(var(--tab) + var(--bas));padding-bottom:var(--bas);display:flex;background:#0b0e2af2;border-top:1px solid var(--bord)}
nav.tabs button{flex:1;min-width:0;background:none;border:0;color:var(--doux);font:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav.tabs button span{font-size:21px;line-height:1}
nav.tabs button.on{color:#fff}nav.tabs button.on span{filter:drop-shadow(0 0 8px #7c5cff)}
/* contenus */
h1{font-size:24px;margin:0 0 4px}h2{font-size:20px;margin:0 0 4px}h3{margin:22px 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:1px;color:var(--doux)}
p.doux,.aide{color:var(--doux);font-size:14px;margin:0 0 12px}.aide{font-size:12.5px;color:#8a91bd;margin:6px 0 12px}.aide a,a.lien{color:var(--cyan)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:13px;border:1px solid var(--bord);background:var(--carte2);color:var(--texte);text-decoration:none;font-weight:650;cursor:pointer;font-size:15px;width:100%;margin-bottom:10px}
.btn.p{background:var(--grad);border-color:transparent}.btn.danger{border-color:#5a2740;color:var(--alerte)}.btn.mini{width:auto;padding:8px 14px;font-size:13px;margin:0}
.rang{display:flex;gap:8px;flex-wrap:wrap}
.choix{padding:10px 14px;border-radius:12px;border:1px solid var(--bord);background:var(--carte);font-size:14px;cursor:pointer}
.choix.on{border-color:var(--violet);background:#7c5cff30;color:#fff}
.carte-m{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid var(--bord);background:var(--carte);margin-bottom:10px;cursor:pointer}
.carte-m.on{border-color:var(--violet);background:#7c5cff22}
.carte-m b{display:block;font-size:15px}.carte-m span{font-size:12.5px;color:var(--doux)}
.carte-m .r{width:18px;height:18px;border-radius:50%;border:2px solid var(--bord);flex:0 0 auto;margin-top:2px}
.carte-m.on .r{border-color:var(--violet);background:var(--violet);box-shadow:inset 0 0 0 3px var(--carte)}
.ok{color:var(--ok)}.ko{color:var(--alerte)}
.grille{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cr{border:1px solid var(--bord);border-radius:14px;background:var(--carte);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.cr .ap{aspect-ratio:1;display:grid;place-items:center;background:#0a0d2b;font-size:38px;overflow:hidden}.cr .ap img,.cr .ap video{width:100%;height:100%;object-fit:cover}
.cr .tt{padding:8px 10px;font-size:12.5px;color:var(--doux);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pouvoirs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 14px}
.pv{padding:14px;border-radius:16px;border:1px solid var(--bord);background:linear-gradient(180deg,#151a47,#0f1336);cursor:pointer}.pv b{display:block;font-size:15px}.pv span{font-size:12px;color:var(--doux)}.pv i{font-style:normal;font-size:26px;display:block;margin-bottom:4px}
.ag{border:1px solid var(--bord);border-radius:16px;background:var(--carte);padding:14px;margin-bottom:10px}
.ag b{font-size:16px}.ag .tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.ag .tags i{font-style:normal;font-size:11.5px;padding:3px 9px;border-radius:99px;background:#1a1f4d;border:1px solid var(--bord);color:#cdbfff}
.ag.actif{border-color:var(--violet);box-shadow:0 0 0 3px #7c5cff22}
/* feuilles */
.voile{position:fixed;inset:0;background:#04061299;backdrop-filter:blur(4px);z-index:20;display:none}.voile.on{display:block}
.feuille{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg2);border-top:1px solid var(--bord);border-radius:22px 22px 0 0;padding:8px 18px calc(var(--bas) + 20px);max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;transform:translateY(105%);transition:transform .26s ease;user-select:text;-webkit-user-select:text}
.feuille.on{transform:none}.poignee{width:42px;height:4px;border-radius:99px;background:var(--bord);margin:6px auto 14px}
.m{margin:0 0 10px;padding:10px 13px;border-radius:15px;max-width:92%;white-space:pre-wrap;word-wrap:break-word;font-size:15px}.m.moi{margin-left:auto;background:var(--grad)}.m.elle{background:var(--carte);border:1px solid var(--bord)}
/* cartes de création dans la conversation */
.cc{margin:8px 0;border:1px solid var(--bord);border-radius:14px;background:var(--carte);overflow:hidden;text-align:left}
.cc img,.cc video{display:block;width:100%;max-height:46dvh;object-fit:contain;background:#000}.cc audio{display:block;width:100%}
.cc .pied{display:flex;gap:8px;align-items:center;padding:8px 10px;flex-wrap:wrap}.cc .pied b{flex:1;font-size:13px;min-width:90px}
.cc .pied button{padding:7px 12px;border-radius:10px;border:1px solid var(--bord);background:var(--carte2);color:#fff;font-size:12.5px;cursor:pointer}
.cc iframe{width:100%;height:55dvh;border:0;background:#fff;display:block}
.plein-v{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;padding-top:var(--haut)}.plein-v.on{display:flex}
.plein-v .barre{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bord)}.plein-v .barre b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plein-v iframe,.plein-v pre{flex:1;border:0;background:#fff;width:100%}.plein-v pre{background:#0a0d2b;color:#dfe3ff;margin:0;padding:12px;overflow:auto;font-size:12.5px;white-space:pre-wrap;user-select:text}
.toast{position:fixed;left:14px;right:14px;bottom:calc(var(--tab) + var(--bas) + 12px);z-index:40;background:var(--carte2);border:1px solid var(--violet);border-radius:14px;padding:12px 14px;font-size:14px;display:none}.toast.on{display:block}
/* assistant de démarrage */
#assist{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;padding:calc(var(--haut) + 12px) 18px calc(var(--bas) + 14px)}
#assist.on{display:flex}
#assist .corps{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 2px 14px;user-select:text;-webkit-user-select:text}
#assist .prog{display:flex;gap:5px;margin-bottom:14px}#assist .prog i{flex:1;height:4px;border-radius:9px;background:var(--bord)}#assist .prog i.f{background:var(--grad)}
#assist .pied{display:flex;gap:10px}#assist .pied .btn{margin:0}
.banniere{position:fixed;left:12px;right:12px;bottom:calc(var(--tab) + var(--bas) + 130px);z-index:15;background:var(--carte2);border:1px solid var(--violet);border-radius:16px;padding:12px 14px;display:none;align-items:center;gap:12px;font-size:13.5px}.banniere.on{display:flex}.banniere div{flex:1}.banniere button{padding:9px 14px;border-radius:11px;border:none;background:var(--grad);color:#fff;font-weight:700}.banniere .x{background:none;color:var(--doux)}
.ctflux{scroll-snap-type:y mandatory;overflow-y:auto;height:calc(100dvh - var(--haut) - 230px);min-height:340px;border-radius:14px}
.ctv{position:relative;scroll-snap-align:start;height:100%;background:#000;border-radius:14px;overflow:hidden;margin-bottom:8px}
.ctm,.ctm video,.ctm img{width:100%;height:100%;object-fit:cover;display:block}
.ctl{position:absolute;left:12px;right:70px;bottom:14px;color:#fff;text-shadow:0 1px 4px #000}.ctl p{margin:4px 0 0;font-size:14px}
.ctr{position:absolute;right:8px;bottom:14px;display:flex;flex-direction:column;gap:12px}.ctr button{background:#0008;border:0;border-radius:50%;width:48px;height:48px;color:#fff;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center}.ctr small{font-size:10px}
</style>
</head>
<body>
<canvas id="scene" aria-label="Sphère 3D de Clipia"></canvas>

<!-- PARLER -->
<section class="vue acc on" id="v-accueil"><div class="haut"><b id="accDate"></b></div><div class="panneau" id="accPanneau"></div></section>
<section class="vue" id="v-store"><div class="plein" id="pStore"></div></section>
<section class="vue" id="v-clipbook"><div class="plein" id="pClipbook"></div></section>
<section class="vue" id="v-cliptok"><div class="plein ctp" id="pClipTok"></div></section>
<section class="vue" id="v-studio"><div class="plein" id="pStudio"></div></section>
<section class="vue" id="v-parler">
  <header class="h">
    <div><div class="logo">CLIPIA<small>X8</small></div><div class="etat"><span class="point" id="point"></span><span id="etatTexte">Prête</span></div></div>
    <span class="moteur" id="moteurAff" role="button">⚡ …</span>
    <button class="rond" id="bHist" aria-label="Historique" style="width:40px;height:40px;font-size:17px">🗨</button>
  </header>
  <div class="espace"></div>
  <div id="idees" class="idees"></div>
  <div class="sous" id="sous"></div>
  <div class="bas">
    <div class="saisie" id="saisie"><textarea id="zone" rows="1" placeholder="Écris à Clipia…" enterkeyhint="send"></textarea><button class="rond p" id="bEnvoi" aria-label="Envoyer">➤</button></div>
    <div class="cmd">
      <button class="rond" id="bClavier" aria-label="Clavier">⌨</button>
      <button class="micro" id="bMicro" aria-label="Parler">🎙</button>
      <button class="rond" id="bMuet" aria-label="Voix">🔊</button>
    </div>
    <div class="mode" id="modeTexte"></div>
  </div>
</section>

<!-- CRÉER -->
<section class="vue" id="v-creer"><div class="plein" id="pCreer">
  <h1>Créer</h1><p class="doux">Choisis un pouvoir, décris ce que tu veux : Clipia s'occupe du reste.</p>
  <div class="pouvoirs" id="pouvoirs"></div>
  <h3>Mes créations</h3><div class="grille" id="galerie"></div><p class="aide" id="galVide">Rien pour l'instant : tes images, musiques, vidéos et codes apparaîtront ici et seront enregistrés dans le téléphone.</p>
</div></section>

<!-- AGENTS -->
<section class="vue" id="v-agents"><div class="plein" id="pAgents"></div></section>

<!-- RÉGLAGES -->
<section class="vue" id="v-reglages"><div class="plein" id="pReglages"></div></section>

<nav class="tabs">
  <button data-v="accueil" class="on"><span>🏠</span>Accueil</button>
  <button data-v="parler"><span>🎙</span>Parler</button>
  <button data-v="creer"><span>✨</span>Créer</button>
  <button data-v="agents"><span>🧩</span>Agents</button>
  <button data-v="store"><span>🏬</span>Store</button>
  <button data-v="reglages"><span>⚙</span>Réglages</button>
</nav>

<div class="voile" id="voile"></div>
<div class="feuille" id="feuilleHist"><div class="poignee"></div><h2>Conversation</h2><div id="hist" style="margin-top:12px"></div></div>
<div class="feuille" id="feuilleLibre"><div class="poignee"></div><div id="libreContenu"></div></div>
<div class="plein-v" id="visu"><div class="barre"><button class="rond" id="visuFermer" style="width:40px;height:40px">✕</button><b id="visuTitre"></b><button class="btn mini" id="visuSauver">⬇ Enregistrer</button></div><div id="visuCorps" style="flex:1;display:flex;flex-direction:column;min-height:0"></div></div>
<div class="toast" id="toast"></div>
<div class="banniere" id="banniere"><div>Installe Clipia sur ton écran d'accueil.</div><button id="bInstaller">Installer</button><button class="x" id="bFermerBanniere" aria-label="Fermer">✕</button></div>
<div id="assist"></div>

<script src="js/core.js"></script>
<script src="js/media.js"></script>
<script src="js/agent.js"></script>
<script src="js/ui.js"></script>
<script src="js/systeme.js"></script>
<script src="js/social.js"></script>
<script src="js/google.js"></script>
<script src="js/kodi.js"></script>
</body>
</html>
