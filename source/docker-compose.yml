services:
  clipia:
    build: .
    container_name: clipia
    restart: unless-stopped
    ports: ["8787:8787"]
    volumes:
      - ./data:/data
      - ./medias:/data/media
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8787}
      CLIPIA_MASTER_KEY: ${CLIPIA_MASTER_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      CLIPIA_CONCURRENCY: 2
    depends_on: [ollama]

  # IA locale gratuite, dans le même réseau
  ollama:
    image: ollama/ollama:latest
    container_name: clipia-ollama
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    # Décommentez pour l'accélération NVIDIA :
    # deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

volumes:
  ollama:
