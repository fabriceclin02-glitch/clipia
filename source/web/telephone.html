<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clipia — Discussion</title><link rel="manifest" href="/telephone.webmanifest"><meta name="theme-color" content="#202c33"><link rel="icon" href="/telephone-icone.svg">
<style>html,body{margin:0;height:100%;background:#0b141a;font-family:system-ui,sans-serif;color:#e9edef}#app{height:100dvh}
.lie{max-width:420px;margin:0 auto;padding:30px 20px;display:grid;gap:14px;text-align:center}.lie h1{margin:0}.lie p{color:#8696a0;margin:0}
.lie input,.lie button{font:inherit;padding:13px;border-radius:12px;border:1px solid #ffffff2a;background:#ffffff10;color:inherit}.lie button{background:#00a884;border:0;font-weight:700;cursor:pointer}</style></head>
<body><div id="app"></div>
<script src="/chat-pc.js"></script>
<script>
const K='clipia:tel2', app=document.getElementById('app');
let cfg={};try{cfg=JSON.parse(localStorage.getItem(K)||'{}')}catch{}
const sauve=()=>{try{localStorage.setItem(K,JSON.stringify(cfg))}catch{}};
const hh=new URLSearchParams(location.hash.slice(1));
async function appairer(code){
  const r=await fetch('/api/appairage/valider',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code,appareil:(navigator.userAgentData?.platform||navigator.platform||'Téléphone')+' (navigateur)'})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.erreur||('Erreur '+r.status));
  cfg={t:j.jeton,nom:j.serveur&&j.serveur.nom};sauve();
}
function accueil(msg){
  app.innerHTML='<div class="lie"><h1>Clipia</h1><p>Scanne le QR code affiché sur ton ordinateur (Clipia → « Connecter mon téléphone »), ou entre le code ci-dessous.</p>'+(msg?'<p style="color:#ff8a80">'+msg+'</p>':'')+'<input id="c" placeholder="Code d\'appairage" autocapitalize="off"><button id="b">Connecter</button></div>';
  document.getElementById('b').onclick=async()=>{try{await appairer(document.getElementById('c').value.trim());demarrer()}catch(e){accueil(e.message)}};
}
function demarrer(){
  const tok=cfg.t;
  const req=async(m,p,b,ms)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||30000);
    try{const r=await fetch(p,{method:m,headers:{authorization:'Bearer '+tok,'content-type':'application/json','x-clipia-accord':''},body:b?JSON.stringify(b):undefined,signal:c.signal});
      const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.erreur||('Erreur '+r.status));e.status=r.status;throw e}return j}
    finally{clearTimeout(t)}};
  ClipiaChatPC.monter(app,{req,nom:cfg.nom,media:u=>(/^https?:/.test(u)?u:location.origin+u)+(u.includes('?')?'&':'?')+'k='+encodeURIComponent(tok),
    surRevoque:()=>{cfg={};sauve();accueil('Ce téléphone a été déconnecté par l\'ordinateur.')},
    menu:[{t:'🔌 Déconnecter ce téléphone',f:()=>{cfg={};sauve();location.reload()}}]});
}
(async()=>{
  if(hh.get('t')){cfg={t:hh.get('t')};sauve();history.replaceState(null,'',location.pathname)}          /* ancien lien avec jeton global */
  if(hh.get('c')){const c=hh.get('c');history.replaceState(null,'',location.pathname);try{await appairer(c)}catch(e){return accueil(e.message)}}
  cfg.t?demarrer():accueil();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/telephone-sw.js').catch(()=>{});
</script></body></html>
