<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob: mediastream:; connect-src 'self';">
<title>Clipia Nova</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ DÉMARRAGE 3D ============ -->
<div id="splash">
  <canvas id="splashOrb"></canvas>
  <div class="splash-txt">
    <h1>CLIPIA <span>NOVA</span></h1>
    <p>Le navigateur compagnon · CLENDAX</p>
    <div class="bar"><i></i></div>
  </div>
</div>

<!-- ============ ASSISTANT DE CONFIGURATION ============ -->
<div id="wizard" class="hidden">
  <div class="wz-card">
    <canvas id="wzOrb"></canvas>
    <div class="wz-steps" id="wzDots"></div>
    <div id="wzBody"></div>
    <div class="wz-nav">
      <button class="ghost" id="wzBack">← Retour</button>
      <button class="primary" id="wzNext">Continuer →</button>
    </div>
  </div>
</div>

<!-- ============ NAVIGATEUR ============ -->
<div id="browser" class="hidden">
  <div id="tabbar">
    <button class="orb-mini" id="orbMini" title="Parler à Clipia (Ctrl+Espace)"><canvas id="miniOrb"></canvas></button>
    <div id="tabs"></div>
    <button id="newTab" class="icon" title="Nouvel onglet (Ctrl+T)">＋</button>
    <button id="newTor" class="icon tor-btn" title="Onglet Tor .onion (Ctrl+Maj+N)">🧅</button>
  </div>
  <div id="toolbar">
    <button class="icon" id="back" title="Précédent (Alt+←)">←</button>
    <button class="icon" id="fwd" title="Suivant (Alt+→)">→</button>
    <button class="icon" id="reload" title="Recharger (F5)">⟳</button>
    <button class="icon" id="home" title="Accueil (Alt+Origine)">⌂</button>
    <div id="omni"><span id="lock">✦</span><input id="url" placeholder="Rechercher, saisir une adresse ou un .onion…" spellcheck="false"><button class="icon star" id="fav" title="Favori (Ctrl+D)">☆</button></div>
    <span id="zoomInfo" class="hidden"></span>
    <button class="icon" id="btnShare" title="Partager (Ctrl+Maj+E)">⤴</button>
    <button class="icon" id="btnReader" title="Mode lecture (Alt+R)">📖</button>
    <button class="icon" id="btnShot" title="Capture (Ctrl+Maj+X)">📸</button>
    <button class="icon" id="btnFix" title="Dépannage de l'ordinateur (Ctrl+Maj+D)">🛠</button>
    <button class="pill" id="btnStore" title="Ctrl+Maj+S">🛍 Store</button>
    <button class="pill" id="btnMail" title="Ctrl+Maj+M">✉ Mails</button>
    <button class="pill ai" id="btnAI" title="Ctrl+J">✦ Clipia</button>
    <button class="icon" id="btnKeys" title="Raccourcis clavier (F1)">⌨</button>
    <button class="icon" id="btnSettings" title="Réglages (Ctrl+,)">⚙</button>
  </div>
  <div id="torBar" class="hidden"><span id="torTxt"></span><i id="torProg"></i></div>
  <div id="findBar" class="hidden"><input id="findIn" placeholder="Rechercher dans la page"><span id="findCount"></span><button class="icon" id="findPrev">↑</button><button class="icon" id="findNext">↓</button><button class="icon" id="findClose">✕</button></div>
  <div id="main">
    <nav id="rail"></nav>
    <aside id="social" class="closed">
      <header><div class="soc-id"><span id="socIc"></span><b id="socName">Réseaux</b></div>
        <div class="ai-tools"><button class="icon" id="socReload" title="Recharger">⟳</button><button class="icon" id="socTab" title="Ouvrir dans un onglet">⧉</button><button class="icon" id="socClose" title="Fermer (Ctrl+B)">✕</button></div></header>
      <div id="socViews"></div>
    </aside>
    <div id="views"></div>
    <aside id="ai" class="closed">
      <header>
        <div class="ai-id"><canvas id="panelOrb"></canvas><div><b>Clipia</b><small id="aiEngine"></small></div></div>
        <div class="ai-tools">
          <select id="aiMode"></select>
          <button class="icon" id="aiVoice" title="Clipia parle (Ctrl+Maj+V)">🔈</button>
          <button class="icon" id="aiClear" title="Nouvelle discussion">🗑</button>
          <button class="icon" id="aiClose">✕</button>
        </div>
      </header>
      <div class="quick">
        <button data-q="sum">📝 Résumer la page</button>
        <button data-q="tr">🌍 Traduire</button>
        <button data-q="exp">💡 Expliquer</button>
        <button data-q="clip">🎬 Idées de clip</button>
        <button data-q="post">📣 Post</button>
        <button data-q="ig">📸 Instagram</button>
        <button data-q="tt">🎵 TikTok</button>
        <button data-q="fb">📘 Facebook</button>
      </div>
      <div id="chat"></div>
      <form id="ask"><button type="button" class="icon mic" id="askMic" title="Dicter (Ctrl+M)">🎤</button><textarea id="askIn" rows="2" placeholder="Écrivez ou parlez à Clipia…" spellcheck="true" lang="fr"></textarea><button class="primary">➤</button></form>
    </aside>
  </div>
</div>

<!-- ============ COMPAGNON PLEIN ÉCRAN ============ -->
<div id="companion" class="hidden">
  <canvas id="bigOrb"></canvas>
  <div class="cp-top"><span id="cpName">Clipia</span><button class="icon" id="cpClose" title="Fermer (Échap)">✕</button></div>
  <div class="cp-state" id="cpState">Je vous écoute…</div>
  <div class="cp-lines" id="cpLines"></div>
  <div class="cp-bar">
    <button class="cp-btn" id="cpHands" title="Mains libres : dites « Clipia… »">🖐 Mains libres</button>
    <button class="cp-mic" id="cpMic" title="Parler (Ctrl+M)">🎤</button>
    <form id="cpForm"><input id="cpIn" placeholder="ou écrivez ici…" spellcheck="true" lang="fr"></form>
  </div>
  <p class="cp-hint">Ctrl+Espace ouvrir/fermer · Ctrl+M parler · Échap couper la voix · glissez la sphère pour la faire tourner</p>
</div>

<!-- ============ RACCOURCIS CLAVIER ============ -->
<div id="keys" class="hidden"><div class="keys-card"><h2>⌨ Raccourcis clavier</h2><div id="keysList"></div><p class="note">Appuyez sur F1 ou Échap pour fermer.</p></div></div>

<div id="shareMenu" class="hidden"></div>

<!-- ============ MODE LECTURE ============ -->
<div id="reader" class="hidden"><div class="rd-bar"><b>📖 Mode lecture</b><span class="rd-sp"></span>
  <button class="btn2" id="rdSmaller">A−</button><button class="btn2" id="rdBigger">A+</button><button class="btn2" id="rdSpeak">🔊 Lire à voix haute</button><button class="btn2" id="rdSum">✦ Résumer</button><button class="icon" id="rdClose">✕</button></div>
  <article id="rdBody"></article></div>

<div id="toast"></div>
<script src="data.js"></script>
<script src="orb.js"></script>
<script src="voice.js"></script>
<script src="app.js"></script>
</body>
</html>
